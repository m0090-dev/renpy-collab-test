# Ren'Py Web ビルド → GitHub Pages 公開（ブランチ別公開つき）
#
# 動作:
#   - main への push       → ビルドしてサイトのルート "/" に公開
#   - 作業ブランチへの push → ビルドして "/<ブランチ名>/" に公開
#   - 公開先は gh-pages ブランチ（Pages の公開ソースを
#     「Deploy from a branch: gh-pages / root」に設定すること）
#
# 仕組み:
#   - 公開は peaceiris/actions-gh-pages で gh-pages ブランチへ書き込む。
#     keep_files: true なので、main の公開でブランチ用フォルダは消えず、
#     ブランチの公開でルートや他ブランチのフォルダも消えない。
#   - ブランチを削除したときの掃除は cleanup-preview.yml が担当する。
#
# 注意:
#   - ブランチ名は英小文字とハイフンのみ（URL のフォルダ名になるため）。
#   - main の公開では、過去の main ビルドにだけ存在した古いファイルが
#     ルートに残ることがある。ファイル名はほぼ固定なので実害は小さいが、
#     気になる場合は gh-pages のルートを手動で掃除する。

name: build-and-deploy-web

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RENPY_VERSION: "8.6.1"
    steps:
      - uses: actions/checkout@v4

      - name: Ren'Py SDK を取得
        run: |
          curl -L -o sdk.tar.bz2 "https://www.renpy.org/dl/${RENPY_VERSION}/renpy-${RENPY_VERSION}-sdk.tar.bz2"
          tar -xjf sdk.tar.bz2
          mv "renpy-${RENPY_VERSION}-sdk" sdk
          curl -L -o web.zip "https://www.renpy.org/dl/${RENPY_VERSION}/renpy-${RENPY_VERSION}-web.zip"
          unzip -o web.zip -d sdk
          test -f sdk/web/hash.txt

      - name: Lint
        run: |
          cd sdk
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy ./renpy.sh ../game lint || true

      - name: Web ビルド
        run: |
          cd sdk
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy \
            ./renpy.sh launcher web_build "$GITHUB_WORKSPACE" --destination "$GITHUB_WORKSPACE/webout"
          test -f "$GITHUB_WORKSPACE/webout/index.html"

      - name: 公開（main → ルート）
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./webout
          keep_files: true
          commit_message: "deploy main: ${{ github.sha }}"

      - name: 公開（作業ブランチ → /<ブランチ名>/）
        if: github.ref != 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./webout
          destination_dir: ${{ github.ref_name }}
          keep_files: true
          commit_message: "deploy ${{ github.ref_name }}: ${{ github.sha }}"
