# Ren'Py Web ビルド → GitHub Pages 公開
#
# 動作:
#   - main への push → ビルドしてサイトのルート "/" に公開
#   - 作業ブランチへの push → ビルドのみ（公開はしない）
#
# 未実装（次段）:
#   - 作業ブランチの "/<ブランチ名>/" 公開。サイト全体を組み立て直して
#     デプロイする方式が必要（単純にブランチごとにデプロイすると
#     他ブランチのフォルダが消える）。

name: build-and-deploy-web

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RENPY_VERSION: "8.6.1"
    steps:
      - uses: actions/checkout@v4

      - name: Ren'Py SDK を取得
        run: |
          curl -L -o sdk.tar.bz2 "https://www.renpy.org/dl/${RENPY_VERSION}/renpy-${RENPY_VERSION}-sdk.tar.bz2"
          tar -xjf sdk.tar.bz2
          mv "renpy-${RENPY_VERSION}-sdk" sdk
          curl -L -o web.zip "https://www.renpy.org/dl/${RENPY_VERSION}/renpy-${RENPY_VERSION}-web.zip"
          unzip -o web.zip -d sdk
          test -f sdk/web/hash.txt

      - name: Lint
        run: |
          cd sdk
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy ./renpy.sh ../game lint || true

      - name: Web ビルド
        run: |
          cd sdk
          SDL_VIDEODRIVER=dummy SDL_AUDIODRIVER=dummy \
          ./renpy.sh launcher web_build "$GITHUB_WORKSPACE" --destination "$GITHUB_WORKSPACE/webout"
          test -f "$GITHUB_WORKSPACE/webout/index.html"
      - name: Pages 用に成果物を上げる（main のみ）
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: webout

      - name: Pages に公開（main のみ）
        if: github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4
